[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skifer"
version = "4.1.0"
description = "Declarative data engineering framework for Spark and Databricks Lakehouse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Julien Houbart", email = "houbartjulien80@gmail.com" }
]
keywords = [
    "databricks", "spark", "pyspark", "delta-lake", "data-engineering", "lakehouse",
    "declarative", "yaml", "etl", "pipeline", "bronze-silver-gold",
    "semantic-layer"
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/morzu117/skifer"
Documentation = "https://morzu117.github.io/skifer"
Repository = "https://github.com/morzu117/skifer"
Changelog = "https://github.com/morzu117/skifer/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/morzu117/skifer/issues"

[project.optional-dependencies]
# --- Runtime Spark / Databricks ---
spark = [
    "pyspark>=3.3.0",
    "delta-spark>=2.0.0"
]

# --- LLM (couche sémantique / agentique) ---
llm-openai = [
    "openai>=1.0.0"
]
llm-anthropic = [
    "anthropic>=0.30.0"
]
llm-google = [
    "google-generativeai>=0.5.0"
]

# --- Exports (PDF, graphiques) ---
semantic-pdf = [
    "fpdf2>=2.7.0",
    "matplotlib>=3.7.0"
]

# --- Databricks workspace API (SQL warehouses, materialized views, Connect) ---
# Unnecessary on a Databricks runtime: the SDK is pre-installed there.
databricks = [
    "databricks-sdk>=0.20.0"
]

# --- Databricks Model Serving ---
# ResponsesAgent needs MLflow 3. databricks-connect brings its own pyspark: install this
# extra WITHOUT [spark] (a serving container has no cluster; Spark comes from Connect serverless).
serving = [
    "mlflow>=3.0,<4",
    "openai>=1.0.0",
    "databricks-connect>=16.1",
]

# --- Export de traces (imports strictement paresseux) ---
tracing = [
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    # The exporter uses MLflow 3 APIs (trace_location, search_traces(locations=)).
    "mlflow>=3.0,<4",
]

# --- Model Context Protocol (imports strictement paresseux) ---
mcp = [
    "mcp>=2.1,<3",
]

# --- Project analyzer : SQL existant -> pipelines Skifer (import strictement paresseux) ---
analyzer = [
    "sqlglot>=25",
]

# --- Embeddings denses du knowledge index (Plan 44, S08 ; import strictement paresseux) ---
knowledge-embeddings = [
    "sentence-transformers>=3",
]

# --- API locale (imports strictement paresseux) ---
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

# --- Bundles pratiques ---
semantic-full = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "fpdf2>=2.7.0",
    "matplotlib>=3.7.0"
]

# --- Documentation (site mkdocs) ---
# Required by `mkdocs build --strict`; mkdocstrings is declared because
# mkdocs.yml configures it as a plugin.
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

# --- Développement ---
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "pytest-mock>=3.10.0",
    # Validates schemas/skifer-pipeline.schema.json. Left undeclared, the 15 tests that
    # exercise the published JSON schema skip silently in a fresh environment.
    "jsonschema>=4.0",
    # Required by FastAPI's TestClient (starlette) to exercise the [api] routes.
    "httpx>=0.27",
    "duckdb>=1,<2",
    # Plan 46 / ADR 0001: import contracts run in CI (`lint-imports`).
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
skifer = "skifer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "streaming: real Structured Streaming tests on the local Delta session (slower)",
]

# Plan 46 / ADR 0001 — import contracts. The governed layer must never enter the
# language core; 46.1 adds the `layers` and `independence` contracts.
[tool.importlinter]
root_package = "skifer"
include_external_packages = true
# Contracts guard runtime structure: TYPE_CHECKING imports never execute or load modules.
# tests/test_import_boundaries.py verifies actual loads in fresh interpreters.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Language core (8 modules) stays free of the governed layer, the engine and Spark"
type = "forbidden"
source_modules = [
    "skifer.core.op_catalog",
    "skifer.core.constants",
    "skifer.core.ir",
    "skifer.core.schema_loader",
    "skifer.core.sql_compiler",
    "skifer.core.json_schema",
    "skifer.core.registry",
    "skifer.core.rule_analyzer",
    "skifer.core.connector",
    "skifer.core.dialect",
]
forbidden_modules = [
    "skifer.semantic",
    "skifer.agentic",
    "skifer.observability",
    "skifer.services",
    "skifer.api",
    "skifer.mcp",
    "pyspark",
    "delta",
    "skifer.core.core",
    "skifer.core.spark_backend",
    "skifer.core.patterns",
    "skifer.core.interpreter",
    "skifer.core.writer",
    "skifer.core.loaders",
    "skifer.lineage",
    "skifer.candidates",
    "skifer.knowledge",
    "skifer.adaptive",
    "skifer.capabilities",
    "skifer.serving",
    "skifer.analyzer",
]

[[tool.importlinter.contracts]]
name = "Semantic layer never imports the agentic layer"
type = "layers"
layers = ["skifer.agentic", "skifer.semantic"]

[[tool.importlinter.contracts]]
name = "Package roots stay lazy"
type = "forbidden"
# Check the __init__ modules themselves, not their descendant modules.
as_packages = false
source_modules = ["skifer", "skifer.core", "skifer.semantic", "skifer.agentic"]
forbidden_modules = [
    "pyspark",
    "delta",
    "skifer.core.core",
    "skifer.agentic.builder_agent",
    "skifer.lineage",
]
