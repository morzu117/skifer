[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skifer-databricks"
version = "4.2.0"
description = "Skifer on Databricks: the MLflow ResponsesAgent serving layer (Genie supervisor, Model Serving) over the governed semantic layer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Julien Houbart", email = "houbartjulien80@gmail.com" }
]
keywords = ["databricks", "mlflow", "model-serving", "genie", "responses-agent", "semantic-layer"]
requires-python = ">=3.10"
# Wraps the governed layer (AgenticHub) and serves it through MLflow 3 on Databricks.
# databricks-connect brings its own pyspark, so this is installed WITHOUT [spark]:
# a serving container has no cluster; Spark comes from Connect serverless.
dependencies = [
    "skifer==4.2.0",
    "mlflow>=3.0,<4",
    "openai>=1.0.0",
    "databricks-connect>=16.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/morzu117/skifer"
Repository = "https://github.com/morzu117/skifer"

# One shared src/. skifer-databricks ships the self-contained serving subpackage;
# the rest of the Databricks integration (UC, warehouse, session detection) stays
# lazily imported across skifer / skifer-engine under the [databricks] extra.
[tool.hatch.build.targets.wheel]
bypass-selection = true
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"../../src/skifer/serving" = "skifer/serving"
