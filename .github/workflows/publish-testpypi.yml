name: Publish to TestPyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: test

    permissions:
      contents: read
      id-token: write   # requis par la publication de confiance TestPyPI (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # One shared src/, four distributions built from packaging/ (hatchling
      # force-include). uv build is what we validate locally; it builds each wheel
      # directly without a copy that would break the ../../src references.
      - name: Build the four wheels
        run: |
          pip install uv
          rm -rf dist && mkdir -p dist
          for pkg in skifer-core skifer skifer-engine skifer-databricks; do
            uv build --wheel "packaging/$pkg" --out-dir dist
          done
          ls -l dist

      - name: Check distributions
        run: pip install twine && twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
