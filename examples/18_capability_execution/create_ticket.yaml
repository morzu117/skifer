id: support.create_ticket
version: 1.0.0
owner: support-platform
description: Create a ticket in the local fake external system
mode: write
executor: example_execute_ticket
acting_as: delegated_user
required_scopes: [tickets:create]
input_schema:
  type: object
  additionalProperties: false
  required: [request_id, description]
  properties:
    request_id:
      type: string
      maxLength: 64
    description:
      type: string
      maxLength: 200
preconditions: []
reversibility: compensatable
compensation: support.close_ticket
approval: supervised
idempotency_key: request_id
provenance:
  policy_uri: policies/support-ticket-v1.md
  policy_hash: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
