# One transformation for both engines. The caller selects only the implementation
# of the business concept; sources, projection, and output names stay unchanged.

tables:
  - name: raw_orders
    alias: orders
    source:
      type: csv
      path: "{{ example_dir }}/data/orders.csv"
      options: {header: "true", inferSchema: "true"}

business_rules:
  - "{{ business_rule }}"

select_final:
  - [order_id, order_id]
  - [amount, amount]
  - [order_class, order_class]
