data_product:
  id: sales.fact_orders
  version: 1.0.0
  owner: data-platform
  description: Certified orders

contract:
  grain: [order_id]
  output:
    order_id: {logical_type: string, required: true, unique: true}

tables:
  - name: raw_orders
    alias: o
    source:
      type: csv
      path: "{{ example_dir }}/data/orders.csv"
      options: {header: "true", inferSchema: "true"}

select_final:
  - [order_id, order_id]
  - [customer_id, customer_id]
  - [region, region]
  - [channel, channel]
  - [amount, amount, [cast:double]]
  - [order_date, order_date, [to_date:yyyy-MM-dd]]
